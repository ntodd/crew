name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.1.1"

# Crew's own CI runs on GitHub-hosted runners, never on Crew (§23).

jobs:
  protocol:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/crew_protocol
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/crew_protocol/deps
            apps/crew_protocol/_build
          key: protocol-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('apps/crew_protocol/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix test

  control-plane:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    defaults:
      run:
        working-directory: apps/crew
    env:
      MIX_ENV: test
      CREW_DB: ${{ matrix.db }}
    services:
      postgres:
        image: ${{ matrix.db == 'postgres' && 'public.ecr.aws/docker/library/postgres:18' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/crew/deps
            apps/crew/_build
          key: cp-${{ matrix.db }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('apps/crew/mix.lock') }}
      - if: matrix.db == 'postgres'
        run: echo "DATABASE_URL=ecto://postgres:postgres@localhost/crew_test" >> "$GITHUB_ENV"
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix sobelow --config --exit
      - run: mix deps.audit
      - run: mix test

  # The UI in a real browser, against a fake GitHub (e2e/).
  browser:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/crew/deps
            apps/crew/_build
          key: e2e-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('apps/crew/mix.lock') }}
      - run: mix deps.get && mix assets.setup && mix assets.build
        working-directory: apps/crew
      # The null-driver agent the box tests enroll (§11.5).
      - run: mix deps.get && mix compile
        working-directory: apps/crew_agent
        env:
          MIX_ENV: dev
      # The log viewer's pure parts (assets/js/log_core.js).
      - run: node --test js/test/*.test.mjs
        working-directory: apps/crew/assets
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      # Screenshots and traces of what failed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-results
          path: tmp/e2e/results
          retention-days: 7

  agent:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/crew_agent
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/crew_agent/deps
            apps/crew_agent/_build
          key: agent-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('apps/crew_agent/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix test

  # native/: crew-vz (§11.4). Unit tests and vet on macOS, plus the
  # linux/arm64 vet crew-vmctl shares. The real-VM suite (make
  # integration) needs Virtualization.framework on bare Apple silicon,
  # which hosted runners don't offer: it runs on the Mac before a release.
  native:
    runs-on: macos-15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: native
    env:
      GO: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/go.mod
          cache: false
      - run: make GO=go
      - run: make GO=go test vet
      - run: GOOS=linux GOARCH=arm64 GOFLAGS=-mod=vendor go vet ./...
      - run: packaging/macos/test-install.sh
        working-directory: .

