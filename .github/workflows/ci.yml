name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.1.1"

# Crew's own CI runs on GitHub-hosted runners, never on Crew (§23).

jobs:
  protocol:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/crew_protocol
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/crew_protocol/deps
            apps/crew_protocol/_build
          key: protocol-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('apps/crew_protocol/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix test

  control-plane:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    defaults:
      run:
        working-directory: apps/crew
    env:
      MIX_ENV: test
      CREW_DB: ${{ matrix.db }}
    services:
      postgres:
        image: ${{ matrix.db == 'postgres' && 'public.ecr.aws/docker/library/postgres:18' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/crew/deps
            apps/crew/_build
          key: cp-${{ matrix.db }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('apps/crew/mix.lock') }}
      - if: matrix.db == 'postgres'
        run: echo "DATABASE_URL=ecto://postgres:postgres@localhost/crew_test" >> "$GITHUB_ENV"
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix sobelow --config --exit
      - run: mix deps.audit
      - run: mix test
      # What Flatcar's Ignition (the version Flatcar ships) makes of the
      # configs the control plane renders for Flatcar boxes (§12.2): every
      # box type, arch and mode, with placeholder values.
      - name: Validate the Flatcar Ignition
        if: matrix.db == 'sqlite'
        env:
          IGNITION_VALIDATE: quay.io/coreos/ignition-validate:v2.24.0@sha256:b951f790f0ec6ae3a440ba67f2121e4ed19017d3f5024e45dd5c5916602687b2
        run: |
          for type in linux-metal linux-vm mac-vm; do
            for arch in amd64 arm64; do
              for mode in provision reprovision; do
                flag=""
                if [ "$mode" = reprovision ]; then flag=--reprovision; fi
                out="$RUNNER_TEMP/$type-$arch-$mode.ign"
                mix crew.ignition --type "$type" --arch "$arch" $flag --out "$out"
                echo "$type $arch $mode"
                docker run --rm -i "$IGNITION_VALIDATE" - < "$out"
              done
            done
          done

  # ShellCheck on what Flatcar boxes and the launchers run (§12.2,
  # §12.3), at a pinned release checked against its SHA-256.
  shell:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        run: |
          tarball="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL -o "$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $tarball" | sha256sum -c -
          tar -xJf "$tarball" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck" --version
          "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck" --shell=sh -x \
            apps/crew/priv/flatcar/* apps/crew/priv/agent/*.sh
      # The control plane's updater (§20.3), which runs as root on its
      # host, and what the release workflow signs and checks with.
      - name: ShellCheck the release and update scripts
        run: |
          sc="$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck"
          "$sc" --shell=sh docker/crew-update docker/test/crew-update-test.sh \
            packaging/release/check.sh packaging/release/test/check-test.sh
          "$sc" -x images/guest/sign.sh packaging/release/build-linux.sh
      - name: crew-update's decisions
        run: docker/test/crew-update-test.sh
      # The release's check job reads every mix.exs with elixir.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: The release check
        run: packaging/release/test/check-test.sh

  # The UI in a real browser, against a fake GitHub (e2e/).
  browser:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/crew/deps
            apps/crew/_build
          key: e2e-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('apps/crew/mix.lock') }}
      - run: mix deps.get && mix assets.setup && mix assets.build
        working-directory: apps/crew
      # The null-driver agent the box tests enroll (§11.5).
      - run: mix deps.get && mix compile
        working-directory: apps/crew_agent
        env:
          MIX_ENV: dev
      # The log viewer's pure parts (assets/js/log_core.js).
      - run: node --test js/test/*.test.mjs
        working-directory: apps/crew/assets
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      # Screenshots and traces of what failed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-results
          path: tmp/e2e/results
          retention-days: 7

  agent:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/crew_agent
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/crew_agent/deps
            apps/crew_agent/_build
          key: agent-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('apps/crew_agent/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix test

  # crew_guest, the guest's init: its tests run a stub runner.
  guest:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/crew_guest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/crew_guest/deps
            apps/crew_guest/_build
          key: guest-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('apps/crew_guest/mix.lock') }}
      # The guest image has it: crew-guest watches the runner's log pages.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq inotify-tools
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix test

  # crew_cache (§15). Its tests run a fake registry in-process. Go is
  # there for the CA chain check in crypto/x509 (the guest's dockerd
  # and containerd verify the cache with it).
  cache:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/crew_cache
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/crew_cache/deps
            apps/crew_cache/_build
          key: cache-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('apps/crew_cache/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix test

  # native/: crew-vz (§11.4). Unit tests and vet on macOS, plus the
  # linux/arm64 vet crew-vmctl shares. The real-VM suite (make
  # integration) needs Virtualization.framework on bare Apple silicon,
  # which hosted runners don't offer: it runs on the Mac before a release.
  native:
    runs-on: macos-15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: native
    env:
      GO: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/go.mod
          cache: false
      - run: make GO=go
      - run: make GO=go test vet
      - run: GOOS=linux GOARCH=arm64 GOFLAGS=-mod=vendor go vet ./...
      - run: packaging/macos/test-install.sh
        working-directory: .

  # crew-vmctl (§10.8) and the Firecracker boxes' packet filter (§14.2),
  # on both arches: the kernel checks etc/nft.conf (with $UPLINK filled
  # in, as crew-net does) and etc/connlimit.rules, and crew-vmctl's tests
  # run on Linux, where its root-only code builds.
  vmctl:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: native
    env:
      GOFLAGS: -mod=vendor
      GOPROXY: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/go.mod
          cache: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables iptables
      - run: nft --version && iptables-nft --version
      - run: sudo nft -c -D UPLINK=eth0 -f crew-vmctl/etc/nft.conf
      - run: sudo iptables-nft-restore --test crew-vmctl/etc/connlimit.rules
      - run: go vet ./crew-vmctl/...
      - run: go test ./crew-vmctl/...

