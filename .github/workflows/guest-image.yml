name: Guest image

# Reviewed builds on main maintain the registry and kernel caches. Other
# branches can read the caches. Release tags call the cold build directly.
on:
  push:
    branches: [main]
    paths:
      - images/guest/**
      - apps/crew_guest/**
      - apps/crew_protocol/**
      - .github/workflows/guest-image*.yml
  pull_request:
    paths:
      - images/guest/**
      - apps/crew_guest/**
      - apps/crew_protocol/**
      - .github/workflows/guest-image*.yml
  workflow_dispatch:
concurrency:
  group: guest-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  main:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/guest-image-build.yml
    permissions:
      contents: read
      packages: write
    with:
      write-cache: true
  branch:
    if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
    uses: ./.github/workflows/guest-image-build.yml
    permissions:
      contents: read
      packages: read
