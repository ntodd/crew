# Crew's nftables ruleset for Firecracker boxes (spec §14.2), shipped in
# the agent tarball as etc/nft.conf. crew-net (`crew-vmctl net-up`)
# loads it once at boot with $UPLINK defined as the uplink interface,
# and `crew-vmctl nft-verify` holds the loaded table to it. The only set
# the agent changes is vm_pairs (crew-vmctl pair-add/pair-del); site4 is
# crew-net's, refilled every 10 minutes (crew-vmctl site4).
#
# Check it with: nft -c -D UPLINK=eth0 -f nft.conf
#
# Two changes from the spec's text, both forced by the kernels it runs on:
#
# - blocked4 leaves out 255.255.255.255/32, which 240.0.0.0/4 covers: nft
#   refuses overlapping intervals in a set without auto-merge, so the
#   spec's set doesn't load anywhere.
# - The cap of 2048 tracked connections per VM isn't here. `ct count` needs
#   nft_connlimit, which Flatcar's kernel doesn't build
#   (CONFIG_NFT_CONNLIMIT is not set). Flatcar has xt_connlimit, so the cap
#   is the same rule in iptables-nft's mangle table, in connlimit.rules,
#   loaded with this file and verified with it. Without ct_new nothing
#   needs the set, so it's gone too.

table inet crew {
  set vm_pairs  { type ifname . ipv4_addr; }                       # crewt<n> . guest ip
  set blocked4  { type ipv4_addr; flags interval;
                  elements = { 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8,
                               169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24,
                               192.0.2.0/24, 192.168.0.0/16, 198.18.0.0/15,
                               198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4,
                               240.0.0.0/4 } }
  set site4     { type ipv4_addr; flags interval; }               # filled by crew-net

  chain pre {                                   # before conntrack
    type filter hook prerouting priority raw; policy accept;
    iifname "crewt*" meta nfproto ipv6 drop
    iifname "crewt*" meta l4proto != { tcp, udp, icmp } drop
    iifname "crewt*" iifname . ip saddr != @vm_pairs drop          # anti-spoofing, fail-closed
    iifname "crewt*" accept
    iifname "lo" accept
    ip daddr { 10.199.0.1, 10.200.0.0/16 } drop                    # Crew ranges: VMs only
  }

  chain input {
    type filter hook input priority filter; policy accept;
    iifname "crewt*" ip daddr 10.199.0.1 tcp dport { 53, 80, 443, 7777 } accept
    iifname "crewt*" ip daddr 10.199.0.1 udp dport 53 accept
    iifname "crewt*" icmp type { echo-request } limit rate 10/second accept
    iifname "crewt*" drop                                           # nothing else on the host VM
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
    iifname "crewt*" ip daddr @blocked4 drop                        # LAN, tailnet, metadata, VMs
    iifname "crewt*" ip daddr @site4 drop                           # this site's own addresses
    iifname "crewt*" oifname $UPLINK accept
    oifname "crewt*" ct state established,related accept
  }

  chain post {
    type nat hook postrouting priority srcnat;
    iifname "crewt*" oifname $UPLINK masquerade
  }
}
